name: Tideland branch validation

on:
  push:
    branches:
      - merge/useful-local-codex

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Projekty/Tideland/package-lock.json

      - name: Install dependencies
        working-directory: Projekty/Tideland
        run: npm ci

      - name: Production build
        working-directory: Projekty/Tideland
        run: npm run build

      - name: Relevant unit tests
        working-directory: Projekty/Tideland
        run: npx vitest run tests/camera-projection.test.ts tests/simulation.test.ts tests/structure-renderer.test.ts tests/survival.test.ts tests/terrain-generation.test.ts
