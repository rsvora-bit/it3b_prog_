name: Validate Tideland v0.2.2 input loading

on:
  push:
    branches: [fix/tideland-input-loading-v022]
    paths:
      - 'Projekty/Tideland/scripts/apply-v022-input-loading.py'
      - '.github/workflows/tideland-v022-input-loading.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v6
        with:
          ref: fix/tideland-input-loading-v022
          fetch-depth: 0

      - name: Apply v0.2.2 patch
        run: python3 Projekty/Tideland/scripts/apply-v022-input-loading.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Projekty/Tideland/package-lock.json

      - name: Install dependencies
        working-directory: Projekty/Tideland
        run: npm ci

      - name: Unit tests
        working-directory: Projekty/Tideland
        run: npm test

      - name: Production build
        working-directory: Projekty/Tideland
        run: npm run build

      - name: Static regression checks
        working-directory: Projekty/Tideland
        run: |
          grep -q "MouseLookFilter" src/input/Input.ts
          grep -q "0.0009" src/player/PlayerController.ts
          grep -q "setLoadingProgress" src/ui/UI.ts
          grep -q "warmUpWorld" src/app/GameApp.ts
          grep -q "GAME_VERSION='0.2.2'" src/config/version.ts
          test -f tests/mouse-look-filter.test.ts

      - name: Commit validated patch
        run: |
          rm -f Projekty/Tideland/scripts/apply-v022-input-loading.py .github/workflows/tideland-v022-input-loading.yml
          git config user.name 'Roman Svora'
          git config user.email 'roman.svora.ml@gmail.com'
          git add -A -- \
            .github/workflows/tideland-v022-input-loading.yml \
            Projekty/Tideland/scripts/apply-v022-input-loading.py \
            Projekty/Tideland/CHANGELOG.md \
            Projekty/Tideland/package.json \
            Projekty/Tideland/package-lock.json \
            Projekty/Tideland/src/config/version.ts \
            Projekty/Tideland/src/input/Input.ts \
            Projekty/Tideland/src/input/MouseLookFilter.ts \
            Projekty/Tideland/src/player/PlayerController.ts \
            Projekty/Tideland/src/save/storage.ts \
            Projekty/Tideland/src/ui/UI.ts \
            Projekty/Tideland/src/ui/style.css \
            Projekty/Tideland/src/app/GameApp.ts \
            Projekty/Tideland/tests/mouse-look-filter.test.ts
          git status --short
          git commit -m 'Tideland v0.2.2 input stability and loading warm-up'
          git push origin HEAD:fix/tideland-input-loading-v022
